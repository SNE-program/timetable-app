# 打签名 APK。
#
# 计划书 12 节要求「GitHub Actions 自动出 APK，tag 触发 release」。
# 这样做的价值不只是省事：**构建过程可复现**。手工在本机打的包，
# 别人无法验证它到底是由哪份源码生成的；CI 从 tag 出发，链条是完整的。
#
# 需要用到的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64   android/keystore/timetable-release.jks 的 base64
#   KEYSTORE_PASSWORD keystore.properties 里的 storePassword
#   KEY_ALIAS         keystore.properties 里的 keyAlias
#   KEY_PASSWORD      keystore.properties 里的 keyPassword
#
# 生成 KEYSTORE_BASE64（在本机执行一次即可）：
#   PowerShell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("android/keystore/timetable-release.jks")) | Set-Clipboard
#
# 缺任何一个 secret，release 步骤都会明确报错停下 ——
# 绝不会悄悄产出一个未签名（或用了 debug 签名）的包。

name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 「附加到 Release」要写权限。仓库默认权限是只读时，那一步会失败 —— 实测踩到过
    # （前面所有步骤都成功，只在最后一步 403）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 校验版本号一致
        run: node scripts/check-version.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试与类型检查
        run: |
          npx tsc --noEmit
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: 构建 Web 产物并同步到 Android
        run: |
          npm run build
          npx cap sync android

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 —— 没有签名密钥就出不了可升级的正式包"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/timetable-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/timetable-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 打包
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 校验签名
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      # 名字要和手工发布时一致：
      #   timetable-app-vX.Y.Z.apk  版本化留档
      #   timetable-app.apk         固定名字；下载页的按钮指向 releases/latest/download/timetable-app.apk
      # 两个文件内容相同，只是名字不同。
      - name: 规范化安装包名字
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/timetable-app-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/timetable-app.apk"
          sha256sum release-assets/*.apk
          ls -l release-assets

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: timetable-apk
          path: release-assets/*.apk

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true
