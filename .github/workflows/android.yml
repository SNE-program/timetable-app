# 打签名 APK。
#
# 计划书 12 节要求「GitHub Actions 自动出 APK，tag 触发 release」。
# 这样做的价值不只是省事：**构建过程可复现**。手工在本机打的包，
# 别人无法验证它到底是由哪份源码生成的；CI 从 tag 出发，链条是完整的。
#
# 需要用到的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64   android/keystore/timetable-release.jks 的 base64
#   KEYSTORE_PASSWORD keystore.properties 里的 storePassword
#   KEY_ALIAS         keystore.properties 里的 keyAlias
#   KEY_PASSWORD      keystore.properties 里的 keyPassword
#
# 生成 KEYSTORE_BASE64（在本机执行一次即可）：
#   PowerShell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("android/keystore/timetable-release.jks")) | Set-Clipboard
#
# 缺任何一个 secret，release 步骤都会明确报错停下 ——
# 绝不会悄悄产出一个未签名（或用了 debug 签名）的包。

name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 「附加到 Release」要写权限。仓库默认权限是只读时，那一步会失败 —— 实测踩到过
    # （前面所有步骤都成功，只在最后一步 403）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 校验版本号一致
        run: node scripts/check-version.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试与类型检查
        run: |
          npx tsc --noEmit
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # 这两个变量必须和网页版一致：APK 里的 Web 产物如果没有云端配置，
      # cloudConfigured() 就是 false —— **安卓版界面上根本不会出现云备份与云端角色的入口**。
      # v1.9.1 的安装包就是这么漏掉的（网页版有、安卓版没有），所以这里除了注入，
      # 下面还有一步"打包后核对产物里到底有没有"。
      - name: 构建 Web 产物并同步到 Android
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::没有配 SUPABASE_URL / SUPABASE_ANON_KEY，这一版会打成完全离线的包（安卓上没有云备份入口）"
          fi
          npm run build
          npx cap sync android

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 —— 没有签名密钥就出不了可升级的正式包"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/timetable-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/timetable-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 打包
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 这一条是被真实事故逼出来的：v1.9.1 的 APK 里没有云端配置，
      # 而"少了入口"这种事在构建日志里一点痕迹都没有。所以打包后直接查产物正文。
      - name: 核对安装包里有没有云端配置
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          HOST=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://##; s#/.*$##')
          if [ -z "$HOST" ]; then
            echo "没配 SUPABASE_URL，跳过核对（这一版本来就是完全离线的包）"
            exit 0
          fi
          if grep -rqsF "$HOST" android/app/src/main/assets/public/assets/; then
            echo "✓ 安装包里带着云端配置（$HOST）"
          else
            echo "::error::安装包里没有云端配置（$HOST）—— 安卓版的云备份与云端角色入口会整个消失"
            exit 1
          fi

      - name: 校验签名
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      # 名字要和手工发布时一致：
      #   timetable-app-vX.Y.Z.apk  版本化留档
      #   timetable-app.apk         固定名字；下载页的按钮指向 releases/latest/download/timetable-app.apk
      # 两个文件内容相同，只是名字不同。
      - name: 规范化安装包名字
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/timetable-app-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/timetable-app.apk"
          sha256sum release-assets/*.apk
          ls -l release-assets

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: timetable-apk
          path: release-assets/*.apk

      # 应用内更新默认从项目自己的存储下载（GitHub 的下载域名在国内校园网里经常连不上）。
      # 没有配 secret 时这一步只是跳过，不会让整个打包失败。
      - name: 同步到应用内更新的下载地址
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "没配 SUPABASE_URL / SUPABASE_SERVICE_KEY，跳过（应用内更新会退回 GitHub 地址）"
            exit 0
          fi
          for f in release-assets/*.apk; do
            echo "上传 $(basename "$f")"
            curl -fsS -X POST \
              "$SUPABASE_URL/storage/v1/object/app/$(basename "$f")" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "x-upsert: true" \
              --data-binary "@$f" || echo "上传失败：$(basename "$f")（不影响 Release）"
          done

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true
