name: 网页版（GitHub Pages）

# 只构建静态文件并发布到 Pages —— 不需要任何密钥，也不会碰 Android 侧
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # npm run build 里已经包含生成 dist/latest.json（应用内检查更新用它）
      - run: npm run build
        env:
          # 云备份（可选）。仓库 Settings → Secrets and variables → Variables 里配置；
          # 没配时构建出的就是完全离线的版本（面板不出现，也不会有任何网络请求）。
          # anon key 是公开的；service_role key 不许进这里，也不许进前端。
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
